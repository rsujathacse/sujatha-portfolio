# Read the Docs — Aether Mesh Sphinx/reST reference
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: aether-mesh/docs/sphinx/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: aether-mesh/docs/sphinx/requirements.txt
    - method: pip
      path: aether-mesh
      extra_requirements:
        - docs
