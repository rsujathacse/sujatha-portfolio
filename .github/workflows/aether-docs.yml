name: Aether Mesh docs (Hugo + Sphinx)

on:
  pull_request:
    paths:
      - aether-mesh/**
      - .readthedocs.yaml
  push:
    branches: [main]
    paths:
      - aether-mesh/**
      - .readthedocs.yaml

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Hugo
        env:
          HUGO_VERSION: "0.134.3"
        run: |
          curl -fsSL -o /tmp/hugo.tgz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tgz -C /tmp hugo
          sudo mv /tmp/hugo /usr/local/bin/hugo
          hugo version
      - name: Build Hugo operator docs
        working-directory: aether-mesh/docs/hugo
        run: hugo --minify -d public
      - name: Build Sphinx (Read the Docs theme)
        run: |
          pip install -r aether-mesh/docs/sphinx/requirements.txt
          python -m sphinx -W -b html aether-mesh/docs/sphinx aether-mesh/docs/sphinx/_build/html
