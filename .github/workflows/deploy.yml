name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-production:
    name: Deploy to rsujathacse.github.io
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Require PAGES_DEPLOY_TOKEN
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$PAGES_DEPLOY_TOKEN" ]; then
            echo "PAGES_DEPLOY_TOKEN is not set on this repository."
            echo "Add it under Settings → Secrets and variables → Actions."
            echo "The secret value must be the token itself (starts with ghp_ or github_pat_), not the name."
            exit 1
          fi

      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: website
          path: build

      - name: Publish to rsujathacse.github.io
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${PAGES_DEPLOY_TOKEN}@github.com/rsujathacse/rsujathacse.github.io.git" \
            site-out
          rsync -a --delete --exclude .git build/ site-out/
          cd site-out
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No production file changes."
            exit 0
          fi
          git commit -m "Deploy website - based on ${GITHUB_SHA}"
          git push origin main
