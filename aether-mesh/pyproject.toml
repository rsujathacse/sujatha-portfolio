[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-mesh"
version = "1.0.0"
description = "Aether Mesh: self-qualifying multi-cluster zero-trust control plane (Cilium ClusterMesh + Tetragon analog)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sujatha R" }]
dependencies = ["pyyaml>=6"]

[project.scripts]
aether = "aether.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aether*"]

[project.optional-dependencies]
dev = ["pytest>=8"]
docs = ["sphinx>=7,<9", "sphinx-rtd-theme>=3"]
